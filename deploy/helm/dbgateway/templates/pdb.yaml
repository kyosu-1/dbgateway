{{- if and .Values.podDisruptionBudget.enabled (gt (int (include "dbgateway.replicas" .)) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dbgateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbgateway.labels" . | nindent 4 }}
spec:
  {{- if hasKey .Values.podDisruptionBudget "minAvailable" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dbgateway.selectorLabels" . | nindent 6 }}
{{- end }}
