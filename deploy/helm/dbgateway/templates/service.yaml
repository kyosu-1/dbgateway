apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbgateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbgateway.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Only the HTTP listener; metrics are on the separate -metrics Service.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dbgateway.selectorLabels" . | nindent 4 }}
