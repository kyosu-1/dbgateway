{{- if and .Values.secret.create .Values.secret.stringData }}
# Created from chart values (secret.create) for quickstarts. In production,
# manage Secrets outside the chart and reference them with envFrom / env.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbgateway.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbgateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secret.stringData }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
