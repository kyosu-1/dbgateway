{{- if .Values.metrics.enabled }}
# A separate ClusterIP Service so that the Ingress (which routes to the main
# Service) can never expose the unauthenticated /metrics endpoint.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "dbgateway.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with .Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dbgateway.selectorLabels" . | nindent 4 }}
{{- end }}
