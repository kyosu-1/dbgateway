name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l . | grep -v '^gen/')"
          buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen
      - name: Unit tests
        run: go test -race ./...
      - name: Validate example configs and run policy tests
        run: |
          go build -o bin/dbgw ./cmd/dbgw
          bin/dbgw config validate --config examples/dbgateway.yaml
          bin/dbgw config validate --config examples/dev/dbgateway.yaml
          bin/dbgw policy test testdata/policy/*.yaml

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  helm:
    # Lints and renders the Helm chart with each value set in
    # deploy/helm/dbgateway/ci/, validates the manifests with kubeconform and
    # the rendered configuration with `dbgw config validate`.
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # linux-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Build dbgw
        run: go build -o bin/dbgw ./cmd/dbgw
      - name: Lint, render and validate the chart
        run: deploy/helm/check.sh

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Build the documentation site (fails on dead links)
        run: npm run build

  editor:
    # The SQL editor bundle (internal/web/ui/static/editor.js) is committed
    # so that building dbgateway needs only Go; check it matches its source.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/editor/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Bundle is up to date
        run: git diff --exit-code -- ../../internal/web/ui/static/editor.js

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL and MySQL
        run: |
          docker compose -f examples/dev/compose.yaml up -d --wait
          docker compose -f examples/dev/mysql/compose.yaml up -d --wait
      - name: Integration tests
        run: go test -tags integration -count=1 ./...
