name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l . | grep -v '^gen/')"
          buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen
      - name: Unit tests
        run: go test -race ./...
      - name: Validate example configs and run policy tests
        run: |
          go build -o bin/dbgw ./cmd/dbgw
          bin/dbgw config validate --config examples/dbgateway.yaml
          bin/dbgw config validate --config examples/dev/dbgateway.yaml
          bin/dbgw policy test testdata/policy/*.yaml

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Build the documentation site (fails on dead links)
        run: npm run build

  editor:
    # The SQL editor bundle (internal/web/ui/static/editor.js) is committed
    # so that building dbgateway needs only Go; check it matches its source.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/editor/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Bundle is up to date
        run: git diff --exit-code -- ../../internal/web/ui/static/editor.js

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL and MySQL
        run: |
          docker compose -f examples/dev/compose.yaml up -d --wait
          docker compose -f examples/dev/mysql/compose.yaml up -d --wait
      - name: Integration tests
        run: go test -tags integration -count=1 ./...
