# Local development configuration. Start PostgreSQL with
#   docker compose -f examples/dev/compose.yaml up -d
# then
#   DBGW_DEV_READER_PASSWORD=reader DBGW_DEV_WRITER_PASSWORD=writer \
#     go run ./cmd/dbgw serve --config examples/dev/dbgateway.yaml
#
# dev_login accepts any e-mail without a password: never use it outside
# your machine (it is refused unless listening on loopback).

server:
  listen: 127.0.0.1:8443
  public_url: http://127.0.0.1:8443
  mode: enforce

auth:
  dev_login: true
  allow_insecure_client_metadata: true
  agent_tokens: { max_ttl: 1h, refresh: true }

store:
  path: var/dev/dbgateway.db

audit:
  dir: var/dev/audit
  retention: 30d

databases:
  - name: dev-main
    labels: { env: prod }       # behave like production (agents see unclassified columns masked)
    primary:
      host: 127.0.0.1
      port: 55432
      dbname: app
      read_user: dbgw_reader
      password_env: DBGW_DEV_READER_PASSWORD
      write_user: dbgw_writer   # examples/dev/initdb/02-writer.sql
      write_password_env: DBGW_DEV_WRITER_PASSWORD
      sslmode: disable
    limits:
      max_rows: 100
      max_bytes: 256KiB
      statement_timeout: 3s
    # Knowledge for agents and people writing SQL (search_objects shows it
    # next to the tables).
    docs:
      description: Sample SaaS database (examples/dev/initdb/01-schema.sql).
      tables:
        public.users:
          description: One row per account.
          columns:
            plan: free or pro.
        public.orders:
          description: One row per purchase.
          columns:
            amount: Total in USD.
      examples:
        - title: Revenue per plan
          sql: |
            SELECT u.plan, sum(o.amount) AS revenue
            FROM orders o JOIN users u ON u.id = o.user_id
            GROUP BY u.plan

groups:
  - name: developers
    members: [dev@example.com, alice@example.com]
  - name: approvers
    members: [bob@example.com]

role_bindings:
  - group: developers
    databases: "*"
    roles: [querier, writer]
  - group: approvers
    databases: "*"
    roles: [querier, writer, approver]

# bob may also use the audit log and user screens.
auditors:
  - user: bob@example.com

# Writes are submitted for approval: log in as alice@example.com, let an
# agent run an UPDATE, then approve it as bob@example.com.
approvals:
  enabled: true
  step_up_max_age: 5m

risk:
  high:
    - stmt.is_write && estimate.rows > 100
    - stmt.is_write && columns.exists(c, c.class != "public")
  medium:
    - stmt.is_write

approval_rules:
  - name: high-risk
    when: risk == "high"
    steps:
      - { role: approver, count: 1 }
    expire_after: 30m
    max_affected_rows: 1000
  - name: default
    when: "true"
    steps:
      - { role: approver, count: 1 }
    expire_after: 1h

break_glass:
  max_duration: 30m
  databases: "*"

data_classes:
  - columns: ["public.users.email", "public.users.phone"]
    class: masked
    semantic_type: contact
  - column_pattern: ".*(password|token|secret).*"
    class: masked
    semantic_type: secret
  - columns: ["public.support_tickets.body"]
    class: no_ai
  - column_pattern: "public\\.[a-z_]+\\.(id|[a-z_]+_id|created_at|updated_at|status|plan|amount|name|reason|subject|churned_at)"
    class: public

semantic_types:
  contact: { method: partial }
  secret: { method: redact }

policies:
  - name: deny-ddl
    when: stmt.kind == "ddl"
    action: deny
  - name: deny-unbounded-writes
    when: stmt.kind in ["update", "delete"] && !stmt.has_where
    action: deny
    hint: "There is no WHERE clause. Narrow down the target rows and run it again."
  - name: agents-never-see-no-ai
    when: principal.kind == "agent" && columns.exists(c, c.class == "no_ai")
    action: deny
    message: "The query references a column classified as no_ai, which is never sent to AI agents."
    hint: "Remove this column and run it again."
  - name: reads
    when: stmt.kind == "select" && !stmt.is_write
    action: allow
  - name: writes
    when: stmt.is_write
    action: approve
    require: { reason: true }
